name: telegram-web-proxy
services:
  bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.bootstrap
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      RELAY_PORT: ${RELAY_PORT:-8080}
      ADMIN_PORT: ${ADMIN_PORT:-8081}
      TPROXY_CONFIG_DIR: /config
      MTPROXY_DIR: /mtproxy
      PROFILES_DIR: /profiles
      PANEL_AUTH_DIR: /panel-auth
      PANEL_CREDENTIALS_DIR: /panel-credentials
      PANEL_ROUTE_DIR: /panel-route
      TPROXY_UID: "10001"
      TPROXY_GID: "10001"
    volumes:
      - ./docker/config:/config
      - ./docker/mtproxy:/mtproxy
      - ./docker/profiles:/profiles
      - ./docker/private:/panel-auth
      - ./docker/private-credentials:/panel-credentials
      - ./docker/generated:/panel-route
    restart: "no"
  relay:
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    restart: unless-stopped
    environment:
      TPROXY_CONFIG: /etc/tproxy-server/config.json
      TPROXY_PROFILES: /var/lib/tproxy-profiles/profiles.json
    command: ["-config", "/etc/tproxy-server/config.json", "-profiles-file", "/var/lib/tproxy-profiles/profiles.json"]
    volumes:
      - ./docker/config:/etc/tproxy-server:ro
      - ./docker/site:/srv/tproxy-site:ro
      - ./docker/profiles:/var/lib/tproxy-profiles:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
      - type: tmpfs
        target: /run
        tmpfs:
          size: 8388608
    healthcheck:
      test: ["CMD", "/usr/local/bin/tproxy-server", "-config", "/etc/tproxy-server/config.json", "-profiles-file", "/var/lib/tproxy-profiles/profiles.json", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [proxy-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  mtproxy-firewall:
    profiles: ["mtproxy"]
    build:
      context: .
      dockerfile: docker/Dockerfile.firewall
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    healthcheck:
      test: ["CMD-SHELL", "nft list table inet mtproxy_guard >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  mtproxy-volume-init:
    profiles: ["mtproxy"]
    image: busybox:1.37.0
    user: "0:0"
    volumes:
      - mtproxy-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data && chmod 0700 /data"]
    restart: "no"
  stats-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.mtproxy-exporter
    environment:
      RELAY_ADMIN_PORT: ${ADMIN_PORT:-8081}
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  mtproxy:
    profiles: ["mtproxy"]
    build:
      context: .
      dockerfile: docker/Dockerfile.mtproxy
    restart: unless-stopped
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
      mtproxy-firewall: {condition: service_healthy}
      mtproxy-volume-init: {condition: service_completed_successfully}
    environment:
      MTPROXY_SECRET_FILE: /run/mtproxy/secret
      MTPROXY_DATA_DIR: /var/lib/mtproxy
      MTPROXY_WORKERS: ${MTPROXY_WORKERS:-1}
      MTPROXY_MAX_CONNECTIONS: ${MTPROXY_MAX_CONNECTIONS:-4096}
      MTPROXY_REFRESH_INTERVAL: ${MTPROXY_REFRESH_INTERVAL:-86400}
      MTPROXY_NAT_INFO: ${MTPROXY_NAT_INFO:-}
    volumes:
      - ./docker/mtproxy:/run/mtproxy:ro
      - mtproxy-data:/var/lib/mtproxy
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 8388608
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8888/stats >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    network_mode: service:relay
    group_add: ["10001"]
    depends_on:
      relay: {condition: service_healthy}
      panel: {condition: service_started}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/generated:/etc/caddy/generated:ro
      - ./docker/security/logs:/var/log/tproxy-panel:rw
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      RELAY_PORT: ${RELAY_PORT:-8080}
    security_opt: [no-new-privileges:true]
  nginx:
    profiles: ["nginx"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
      panel: {condition: service_started}
    environment:
      RELAY_PORT: ${RELAY_PORT:-8080}
      NGINX_ENVSUBST_FILTER: ^RELAY_PORT$
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/generated:/etc/nginx/generated:ro
      - ./docker/security/logs:/var/log/tproxy-panel:rw
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
  panel-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes:
      - panel-data:/data
      - ./docker/security/logs:/security-logs
    command: ["sh", "-c", "mkdir -p /security-logs/banlist && touch /security-logs/auth.log /security-logs/access.log && chown -R 10001:10001 /data /security-logs && chmod 0770 /security-logs && chmod 0750 /security-logs/banlist && chmod 0600 /security-logs/auth.log && chmod 0660 /security-logs/access.log"]
    restart: "no"
  fail2ban:
    image: crazymax/fail2ban:1.1.0
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
    volumes:
      - ./docker/security/fail2ban/jail.d:/etc/fail2ban/jail.d:ro
      - ./docker/security/fail2ban/filter.d/tproxy-panel.conf:/etc/fail2ban/filter.d/tproxy-panel.conf:ro
      - ./docker/security/fail2ban/filter.d/tproxy-caddy-probes.conf:/etc/fail2ban/filter.d/tproxy-caddy-probes.conf:ro
      - ./docker/security/fail2ban/filter.d/tproxy-nginx-probes.conf:/etc/fail2ban/filter.d/tproxy-nginx-probes.conf:ro
      - ./docker/security/fail2ban/action.d/docker-user.conf:/etc/fail2ban/action.d/docker-user.conf:ro
      - ./docker/security/logs:/var/log/tproxy-panel:rw
      - fail2ban-data:/data
    depends_on:
      panel: {condition: service_started}
  panel:
    user: "10001:10001"
    build:
      context: .
      dockerfile: docker/Dockerfile.panel
    restart: unless-stopped
    environment:
      PANEL_ADDR: ":8088"
      PANEL_AUTH_FILE: /etc/tproxy-panel/panel-auth.json
      PANEL_DB: /var/lib/tproxy-panel/panel.db
      TPROXY_CONFIG: /etc/tproxy-server/config.json
      TPROXY_PROFILES: /var/lib/tproxy-profiles/profiles.json
      MTPROXY_SECRET_FILE: /run/mtproxy/secret
      PANEL_AUTH_LOG: /var/log/tproxy-panel/auth.log
      PANEL_TRUST_PROXY: "true"
      PANEL_BANLIST_DIR: /var/log/tproxy-panel/banlist
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      panel-volume-init: {condition: service_completed_successfully}
    volumes:
      - panel-data:/var/lib/tproxy-panel
      - ./docker/config/config.json:/etc/tproxy-server/config.json:ro
      - ./docker/private:/etc/tproxy-panel:ro
      - ./docker/profiles:/var/lib/tproxy-profiles:rw
      - ./docker/mtproxy:/run/mtproxy:rw
      - ./docker/security/logs:/var/log/tproxy-panel:rw
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 8388608
    networks: [proxy-internal]
    security_opt: [no-new-privileges:true]
    read_only: true
networks:
  proxy-internal:
    driver: bridge
volumes:
  panel-data:
  caddy-data:
  caddy-config:
  mtproxy-data:
  fail2ban-data:
