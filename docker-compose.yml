name: telegram-web-proxy
services:
  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    restart: unless-stopped
    command: ["-config", "/etc/tproxy-server/config.json", "-profiles-file", "/etc/tproxy-server/profiles.json"]
    volumes:
      - ./docker/config:/etc/tproxy-server:ro
      - ./docker/site:/srv/tproxy-site:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/tproxy-server", "-config", "/etc/tproxy-server/config.json", "-profiles-file", "/etc/tproxy-server/profiles.json", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [proxy-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
  caddy:
    profiles: ["caddy"]
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
      panel: {condition: service_started}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    security_opt: [no-new-privileges:true]
  nginx:
    profiles: ["nginx"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    network_mode: service:relay
    depends_on:
      relay: {condition: service_healthy}
      panel: {condition: service_started}
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
  panel-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - panel-data:/data
    restart: "no"
  panel:
    user: "10001:10001"
    build:
      context: .
      dockerfile: docker/Dockerfile.panel
    restart: unless-stopped
    environment:
      PANEL_ADDR: ":8088"
      PANEL_USER: ${PANEL_USER:-admin}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Set PANEL_PASSWORD in .env}
      PANEL_DB: /var/lib/tproxy-panel/panel.db
      TPROXY_CONFIG: /etc/tproxy-server/config.json
      TPROXY_PROFILES: /etc/tproxy-server/profiles.json
    volumes:
      - panel-data:/var/lib/tproxy-panel
      - ./docker/config:/etc/tproxy-server:ro
    networks: [proxy-internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=8m]
networks:
  proxy-internal:
    driver: bridge
volumes:
  panel-data:
  caddy-data:
  caddy-config:
