name: Shell checks

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n tgweb-install.sh

      - name: ShellCheck
        run: shellcheck --severity=warning --shell=bash tgweb-install.sh

  fail2ban-filters:
    name: Fail2ban filter regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Fail2ban tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fail2ban

      - name: Extract installer filters and test Nginx/Caddy log formats
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python3 - tgweb-install.sh "$tmpdir" <<'PY'
          import pathlib, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          target = pathlib.Path(sys.argv[2])
          for name in ("auth", "scan"):
              marker = f'cat > "$filter_dir/tproxy-web-{name}.conf" <<\\'EOF\\'\\n'
              start = source.index(marker) + len(marker)
              end = source.index("\\nEOF", start)
              (target / f"tproxy-web-{name}.conf").write_text(source[start:end] + "\\n", encoding="utf-8")
          PY
          printf '%s\\n' \
            '203.0.113.7 401 GET' \
            '{"request":{"client_ip":"2001:db8::8","method":"GET"},"status":403}' \
            > "$tmpdir/auth.log"
          printf '%s\\n' \
            '203.0.113.9 404 GET' \
            '{"request":{"client_ip":"2001:db8::10","method":"POST"},"status":400}' \
            > "$tmpdir/scan.log"
          fail2ban-regex "$tmpdir/auth.log" "$tmpdir/tproxy-web-auth.conf" > "$tmpdir/auth.result"
          fail2ban-regex "$tmpdir/scan.log" "$tmpdir/tproxy-web-scan.conf" > "$tmpdir/scan.result"
          grep -Eq '2 matched' "$tmpdir/auth.result"
          grep -Eq '2 matched' "$tmpdir/scan.result"
          echo "Both filters matched Nginx and Caddy fixtures."

  upstream-go:
    name: Pinned tproxy-server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Fetch pinned upstream source
        env:
          UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
        run: |
          git clone --filter=blob:none https://github.com/telegramdesktop/tproxy-server.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Go tests
        working-directory: upstream
        run: go test ./...

      - name: Build tproxy-server
        working-directory: upstream
        run: go build -trimpath -ldflags="-s -w" -o tproxy-server ./cmd/tproxy-server
