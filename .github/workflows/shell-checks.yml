name: Shell checks

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n tgweb-install.sh
          sh -n docker/mtproxy/entrypoint.sh
          sh -n docker/relay-supervisor.sh
          sh -n docker/mtproxy/firewall.sh
          shellcheck --severity=warning --shell=sh docker/mtproxy/entrypoint.sh docker/relay-supervisor.sh docker/mtproxy/firewall.sh

      - name: ShellCheck
        run: shellcheck --severity=warning --shell=bash tgweb-install.sh

  upstream-go:
    name: Pinned tproxy-server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Fetch pinned upstream source
        env:
          UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
        run: |
          git clone --filter=blob:none https://github.com/telegramdesktop/tproxy-server.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Go tests
        working-directory: upstream
        run: go test ./...

      - name: Build tproxy-server
        working-directory: upstream
        run: go build -trimpath -ldflags="-s -w" -o tproxy-server ./cmd/tproxy-server

  docker-panel:
    name: Docker panel tests and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: panel/go.mod
      - name: Panel tests
        working-directory: panel
        run: |
          go mod tidy
          go test ./...
          go vet ./...
          node --check web/app.js
      - name: Build panel image
        run: docker build -f docker/Dockerfile.panel -t tproxy-panel:test .
      - name: Build relay image
        run: docker build -f docker/Dockerfile.relay -t tproxy-relay:test .
      - name: Build official MTProxy image
        run: docker build -f docker/Dockerfile.mtproxy -t tproxy-mtproxy:test .
      - name: Build MTProxy stats exporter image
        run: docker build -f docker/Dockerfile.mtproxy-exporter -t tproxy-mtproxy-exporter:test .
      - name: Build MTProxy firewall image
        run: docker build -f docker/Dockerfile.firewall -t tproxy-firewall:test .

  docker-compose:
    name: Compose configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: |
          cp .env.example .env
          cp docker/mtproxy/secret.example docker/mtproxy/secret
          python3 -m json.tool docker/config/config.example.json >/dev/null
          python3 -m json.tool docker/config/profiles.example.json >/dev/null
          docker compose --profile caddy --profile mtproxy config --quiet
          docker compose --profile nginx --profile mtproxy config --quiet
          mkdir -p /tmp/nginx-certs docker/security/logs docker/generated docker/private docker/private-credentials
          cat > docker/generated/panel-route.caddy <<'CADDY'
          @panel_access path /panel-ci-test /panel-ci-test/*
          log_skip @panel_access
          @panel_root_no_slash path /panel-ci-test
          redir @panel_root_no_slash /panel-ci-test/ 308
          handle_path /panel-ci-test/* {
            reverse_proxy panel:8088
          }
          CADDY
          cat > docker/generated/panel-route.nginx.conf <<'NGINX'
          location = /panel-ci-test { return 308 /panel-ci-test/; }
          location ^~ /panel-ci-test/ {
            rewrite ^/panel-ci-test/(.*)$ /$1 break;
            proxy_pass http://$panel_upstream;
          }
          NGINX
          touch docker/security/logs/auth.log docker/security/logs/access.log
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout /tmp/nginx-certs/privkey.pem -out /tmp/nginx-certs/fullchain.pem
          docker run --rm -e RELAY_PORT=18080 -e NGINX_ENVSUBST_FILTER=^RELAY_PORT$ \
            -v "$PWD/docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "/tmp/nginx-certs:/etc/nginx/certs:ro" \
            -v "$PWD/docker/security/logs:/var/log/tproxy-panel" \
            -v "$PWD/docker/generated:/etc/nginx/generated:ro" \
            nginx:1.28-alpine nginx -t
          docker run --rm -e DOMAIN=proxy.example.com -e ACME_EMAIL=admin@example.com -e RELAY_PORT=18080 -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/docker/generated:/etc/caddy/generated:ro" -v "$PWD/docker/security/logs:/var/log/tproxy-panel" caddy:2.11.4-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate
          docker run --rm --entrypoint fail2ban-client -v "$PWD/docker/security/fail2ban/jail.d:/etc/fail2ban/jail.d:ro" -v "$PWD/docker/security/fail2ban/filter.d/tproxy-panel.conf:/etc/fail2ban/filter.d/tproxy-panel.conf:ro" -v "$PWD/docker/security/fail2ban/filter.d/tproxy-caddy-probes.conf:/etc/fail2ban/filter.d/tproxy-caddy-probes.conf:ro" -v "$PWD/docker/security/fail2ban/filter.d/tproxy-nginx-probes.conf:/etc/fail2ban/filter.d/tproxy-nginx-probes.conf:ro" -v "$PWD/docker/security/fail2ban/action.d/docker-user.conf:/etc/fail2ban/action.d/docker-user.conf:ro" -v "$PWD/docker/security/logs:/var/log/tproxy-panel:ro" crazymax/fail2ban:1.1.0 -t
          printf '2026/11/24 12:00:00 auth_failed ip=203.0.113.10\n' > docker/security/logs/auth-fixture.log
          printf '{"request":{"client_ip":"203.0.113.11","uri":"/.env"},"status":404}\n' > docker/security/logs/caddy-fixture.log
          printf '203.0.113.12 - - [24/Nov/2026:12:00:00 +0000] "GET /.git/config HTTP/1.1" 404 12 "-" "scanner"\n' > docker/security/logs/nginx-fixture.log
          docker run --rm --entrypoint sh -v "$PWD/docker/security/fail2ban/filter.d/tproxy-panel.conf:/etc/fail2ban/filter.d/tproxy-panel.conf:ro" -v "$PWD/docker/security/fail2ban/filter.d/tproxy-caddy-probes.conf:/etc/fail2ban/filter.d/tproxy-caddy-probes.conf:ro" -v "$PWD/docker/security/fail2ban/filter.d/tproxy-nginx-probes.conf:/etc/fail2ban/filter.d/tproxy-nginx-probes.conf:ro" -v "$PWD/docker/security/logs:/var/log/tproxy-panel:ro" crazymax/fail2ban:1.1.0 -c 'fail2ban-regex /var/log/tproxy-panel/auth-fixture.log tproxy-panel && fail2ban-regex /var/log/tproxy-panel/caddy-fixture.log tproxy-caddy-probes && fail2ban-regex /var/log/tproxy-panel/nginx-fixture.log tproxy-nginx-probes'
          test -s docker/site/index.html
          python3 -m py_compile docker/bootstrap.py docker/mtproxy/stats-exporter.py
          python3 -m unittest docker/test_bootstrap.py
          node --check panel/web/app.js
          docker build -f docker/Dockerfile.bootstrap -t tproxy-bootstrap:test .
          docker compose build bootstrap relay
          RELAY_PORT=18080 ADMIN_PORT=18081 docker compose run --rm --no-deps -e PANEL_PRINT_CREDENTIALS=0 bootstrap
          docker run --rm \
            -v "$PWD/docker/config:/opt/telegram-web-proxy/docker/config:ro" \
            -v "$PWD/docker/site:/opt/telegram-web-proxy/docker/site:ro" \
            -v "$PWD/docker/profiles:/opt/telegram-web-proxy/docker/profiles:ro" \
            --entrypoint /usr/local/bin/tproxy-server telegram-web-proxy-relay:latest \
            -config /opt/telegram-web-proxy/docker/config/config.json \
            -profiles-file /opt/telegram-web-proxy/docker/profiles/profiles.json -check
