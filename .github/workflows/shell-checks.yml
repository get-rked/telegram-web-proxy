name: Shell checks

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n tgweb-install.sh
          sh -n docker/mtproxy/entrypoint.sh
          sh -n docker/relay-supervisor.sh
          sh -n docker/mtproxy/firewall.sh
          shellcheck --severity=warning --shell=sh docker/mtproxy/entrypoint.sh docker/relay-supervisor.sh docker/mtproxy/firewall.sh

      - name: ShellCheck
        run: shellcheck --severity=warning --shell=bash tgweb-install.sh

  upstream-go:
    name: Pinned tproxy-server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Fetch pinned upstream source
        env:
          UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
        run: |
          git clone --filter=blob:none https://github.com/telegramdesktop/tproxy-server.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Go tests
        working-directory: upstream
        run: go test ./...

      - name: Build tproxy-server
        working-directory: upstream
        run: go build -trimpath -ldflags="-s -w" -o tproxy-server ./cmd/tproxy-server

  docker-panel:
    name: Docker panel tests and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: panel/go.mod
      - name: Panel tests
        working-directory: panel
        run: |
          go mod tidy
          go test ./...
          go vet ./...
          node --check web/app.js
      - name: Build panel image
        run: docker build -f docker/Dockerfile.panel -t tproxy-panel:test .
      - name: Build relay image
        run: docker build -f docker/Dockerfile.relay -t tproxy-relay:test .
      - name: Build official MTProxy image
        run: docker build -f docker/Dockerfile.mtproxy -t tproxy-mtproxy:test .
      - name: Build MTProxy stats exporter image
        run: docker build -f docker/Dockerfile.mtproxy-exporter -t tproxy-mtproxy-exporter:test .
      - name: Build MTProxy firewall image
        run: docker build -f docker/Dockerfile.firewall -t tproxy-firewall:test .
      - name: Build MTProxy stats exporter image
        run: docker build -f docker/Dockerfile.mtproxy-exporter -t tproxy-mtproxy-exporter:test .

  docker-compose:
    name: Compose configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: |
          cp .env.example .env
          sed -i 's/replace-with-at-least-16-random-characters/ci-only-not-a-production-password/' .env
          cp docker/mtproxy/secret.example docker/mtproxy/secret
          docker compose --profile caddy --profile mtproxy config --quiet
          docker compose --profile nginx --profile mtproxy config --quiet
          mkdir -p /tmp/nginx-certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout /tmp/nginx-certs/privkey.pem -out /tmp/nginx-certs/fullchain.pem
          docker run --rm \
            -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/nginx-certs:/etc/nginx/certs:ro" \
            nginx:1.28-alpine nginx -t
          test -s docker/site/index.html
          python3 -m py_compile docker/bootstrap.py docker/mtproxy/stats-exporter.py
          node --check panel/web/app.js
          python3 -m unittest docker/test_bootstrap.py
          docker build -f docker/Dockerfile.bootstrap -t tproxy-bootstrap:test .
          python3 -m json.tool docker/config/config.example.json >/dev/null
          python3 -m json.tool docker/config/profiles.example.json >/dev/null
