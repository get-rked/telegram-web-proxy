name: Shell checks

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash, ShellCheck and installer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n tgweb-install.sh
          bash -n tests/test_installer.sh
          bash -n tests/test_advanced.sh
          bash -n tproxy-advanced.sh

      - name: ShellCheck
        run: shellcheck --severity=warning --shell=bash tgweb-install.sh tproxy-advanced.sh tests/test_installer.sh tests/test_advanced.sh

      - name: Installer unit tests
        run: bash tests/test_installer.sh

      - name: Advanced manager unit tests
        run: bash tests/test_advanced.sh

  upstream-go:
    name: Pinned tproxy-server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Fetch pinned upstream source
        env:
          UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
        run: |
          git clone --filter=blob:none https://github.com/telegramdesktop/tproxy-server.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Go tests
        working-directory: upstream
        run: go test ./...

      - name: Build tproxy-server
        working-directory: upstream
        run: go build -trimpath -ldflags="-s -w" -o tproxy-server ./cmd/tproxy-server
