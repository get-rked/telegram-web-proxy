name: Shell checks

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax
        run: |
          bash -n tgweb-install.sh

      - name: ShellCheck
        run: shellcheck --severity=warning --shell=bash tgweb-install.sh

      - name: Validate Fail2ban filters
        run: |
          sudo apt-get update
          sudo apt-get install --yes fail2ban python3-systemd
          /usr/bin/python3 -c 'import systemd.journal'
          sudo install -m 0644 panel/fail2ban-filter.conf /etc/fail2ban/filter.d/tproxy-panel.conf
          sudo install -m 0644 panel/fail2ban-jail.conf /etc/fail2ban/jail.d/tproxy-panel.local
          sudo install -m 0644 panel/fail2ban-nginx-scan.conf /etc/fail2ban/filter.d/tproxy-nginx-scan.conf
          sudo install -m 0644 panel/fail2ban-caddy-scan.conf /etc/fail2ban/filter.d/tproxy-caddy-scan.conf
          sudo install -m 0644 panel/fail2ban-server-abuse.conf /etc/fail2ban/filter.d/tproxy-server-abuse.conf
          sudo install -m 0644 panel/fail2ban-mtproxy-abuse.conf /etc/fail2ban/filter.d/tproxy-mtproxy-abuse.conf
          sudo install -m 0644 panel/fail2ban-jail-proxy.conf /etc/fail2ban/jail.d/tproxy-proxy.local
          sudo fail2ban-client -t
          printf '%s\n' '198.51.100.23 - - [25/Nov/2026:10:00:00 +0000] "GET /.env HTTP/1.1" 404 12' > /tmp/tproxy-nginx.log
          fail2ban-regex /tmp/tproxy-nginx.log panel/fail2ban-nginx-scan.conf > /tmp/f2b-nginx.out || { cat /tmp/f2b-nginx.out; exit 1; }
          cat /tmp/f2b-nginx.out
          grep -Eq '[1-9][0-9]* matched' /tmp/f2b-nginx.out
          printf '%s\n' '{"request":{"remote_ip":"198.51.100.24","client_ip":"198.51.100.24","uri":"/.git/config"},"status":404}' > /tmp/tproxy-caddy.log
          fail2ban-regex /tmp/tproxy-caddy.log panel/fail2ban-caddy-scan.conf > /tmp/f2b-caddy.out || { cat /tmp/f2b-caddy.out; exit 1; }
          cat /tmp/f2b-caddy.out
          grep -Eq '[1-9][0-9]* matched' /tmp/f2b-caddy.out
          printf '%s\n' '2026/11/25 [SECURITY] suspicious request remote=198.51.100.25' > /tmp/tproxy-runtime.log
          fail2ban-regex /tmp/tproxy-runtime.log panel/fail2ban-server-abuse.conf > /tmp/f2b-runtime.out || { cat /tmp/f2b-runtime.out; exit 1; }
          cat /tmp/f2b-runtime.out
          grep -Eq '[1-9][0-9]* matched' /tmp/f2b-runtime.out
          printf '%s\n' '198.51.100.26 - - [25/Nov/2026:10:00:00 +0000] "GET /proxy HTTP/1.1" 404 12' > /tmp/tproxy-normal.log
          fail2ban-regex /tmp/tproxy-normal.log panel/fail2ban-nginx-scan.conf > /tmp/f2b-normal.out || true
          cat /tmp/f2b-normal.out
          grep -Eq '0 matched' /tmp/f2b-normal.out
          printf '%s\n' 'mtproxy: invalid secret from 198.51.100.27; connection closed' > /tmp/tproxy-telegram.log
          fail2ban-regex /tmp/tproxy-telegram.log panel/fail2ban-mtproxy-abuse.conf > /tmp/f2b-telegram.out || true
          grep -Eq '0 matched' /tmp/f2b-telegram.out

  upstream-go:
    name: Pinned tproxy-server tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Fetch pinned upstream source
        env:
          UPSTREAM_COMMIT: c8adb8b7c6b7fc46c12ae3acb68be9070c26a8e8
        run: |
          git clone --filter=blob:none https://github.com/telegramdesktop/tproxy-server.git upstream
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Go tests
        working-directory: upstream
        run: go test ./...

      - name: Build tproxy-server
        working-directory: upstream
        run: go build -trimpath -ldflags="-s -w" -o tproxy-server ./cmd/tproxy-server

  web-admin-panel:
    name: Web admin panel tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: panel/go.sum

      - name: Format Go sources
        run: gofmt -w main.go main_test.go

      - name: Go tests with race detector
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Build web admin panel
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o /tmp/tproxy-panel .

      - name: Check dashboard JavaScript syntax
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("panel/templates/dashboard.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"expected one dashboard script, found {len(scripts)}")
          Path("/tmp/dashboard.js").write_text(scripts[0])
          PY
          node --check /tmp/dashboard.js
