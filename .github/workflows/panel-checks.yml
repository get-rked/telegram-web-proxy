name: Web panel checks

on:
  push:
    branches:
      - "feature/**"
      - "hardening/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    name: Go panel tests, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: web-panel/go.mod
      - name: Verify formatting
        working-directory: web-panel
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: web-panel
        run: go test ./...
      - name: Vet
        working-directory: web-panel
        run: go vet ./...
      - name: Build
        working-directory: web-panel
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o /tmp/tproxy-panel .
