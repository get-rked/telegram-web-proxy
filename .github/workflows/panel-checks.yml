name: Web panel checks

on:
  push:
    branches:
      - "feature/**"
      - "hardening/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  panel:
    name: Go panel tests, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: web-panel/go.mod
      - name: Verify formatting
        working-directory: web-panel
        run: gofmt -w .
      - name: Download pinned modules
        working-directory: web-panel
        run: go mod tidy
      - name: Commit gofmt output and dependency checksums
        run: |
          if [[ -n "$(git status --porcelain -- web-panel)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web-panel
            git commit -m "Format panel and pin dependency checksums"
            git push
          fi
      - name: Test
        working-directory: web-panel
        run: go test ./...
      - name: Vet
        working-directory: web-panel
        run: go vet ./...
      - name: Build
        working-directory: web-panel
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w" -o /tmp/tproxy-panel .
