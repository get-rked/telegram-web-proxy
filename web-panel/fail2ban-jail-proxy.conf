# Template installed as /etc/fail2ban/jail.d/tproxy-proxy.local.
# The installer enables only the active web-server jail.
# SSH and recidive are configured independently and are never overwritten.

[tproxy-nginx-scan]
enabled = false
filter = tproxy-nginx-scan
logpath = /var/log/nginx/tproxy-access.log
backend = auto
maxretry = 8
findtime = 600
bantime = 3600

[tproxy-caddy-scan]
enabled = false
filter = tproxy-caddy-scan
logpath = /var/log/caddy/tproxy-access.json
backend = auto
maxretry = 8
findtime = 600
bantime = 3600

[tproxy-server-abuse]
enabled = true
filter = tproxy-server-abuse
backend = systemd
journalmatch = _SYSTEMD_UNIT=tproxy-server.service
maxretry = 5
findtime = 600
bantime = 3600

[tproxy-mtproxy-abuse]
enabled = true
filter = tproxy-mtproxy-abuse
backend = systemd
journalmatch = _SYSTEMD_UNIT=mtproxy.service
maxretry = 5
findtime = 600
bantime = 3600
