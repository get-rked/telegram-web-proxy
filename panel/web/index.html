<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Web Proxy</title><style>
:root{color-scheme:dark;--bg:#0b1220;--card:#142238;--line:#293b54;--text:#e8eef7;--muted:#91a1b8;--green:#75e0b1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#193454,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:25px;margin:0}.muted{color:var(--muted)}.status{border:1px solid #23674f;color:var(--green);padding:5px 12px;border-radius:30px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:linear-gradient(145deg,var(--card),#101a2a);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:15px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:20px;font-weight:650;margin-top:7px;overflow-wrap:anywhere}h2{font-size:16px;margin:0 0 12px}.profile{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.profile:first-child{border:0}.error{color:#ff9292}@media(max-width:600px){main{padding:24px 14px}header{align-items:flex-start;gap:15px;flex-direction:column}}
</style></head><body><main><header><div><h1>Telegram Web Proxy</h1><div class="muted">Панель управления сервером</div></div><span class="status" id="state">Проверка…</span></header><div class="grid"><div class="card"><div class="label">Домен</div><div class="value" id="hostname">—</div></div><div class="card"><div class="label">Relay</div><div class="value" id="relay">—</div></div><div class="card"><div class="label">Профили</div><div class="value" id="count">—</div></div></div><section class="card"><h2>Профили Web Proxy</h2><div id="profiles" class="muted">Загрузка…</div></section><p class="muted">Секреты профилей не отображаются. Управление профилями будет добавлено в следующем этапе.</p></main><script src="/admin/app.js" defer></script></body></html>
