real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $request_uri $security_loggable {
    default 0;
    ~*(/\\.env|/\\.git|/wp-login\\.php|/wp-admin|/phpmyadmin|/xmlrpc\\.php|/vendor/phpunit|/actuator/env|/server-status|/cgi-bin|/HNAP1|/manager/html) 1;
}

limit_req_zone $binary_remote_addr zone=panel_requests:10m rate=30r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    limit_req_status 429;
    access_log /var/log/tproxy-panel/access.log combined if=$security_loggable;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $panel_upstream panel:8088;

    location /admin {
        limit_req zone=panel_requests burst=20 nodelay;
        proxy_pass http://$panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
