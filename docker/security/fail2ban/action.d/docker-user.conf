[Definition]

[Init]
name = tproxy

actionstart = mkdir -p /var/log/tproxy-panel/banlist/<name>
              iptables -w -N TPF2B-<name> 2>/dev/null || true
              iptables -w -C DOCKER-USER -j TPF2B-<name> 2>/dev/null || iptables -w -I DOCKER-USER 1 -j TPF2B-<name>
              ip6tables -w -N TPF2B6-<name> 2>/dev/null || true
              ip6tables -w -C DOCKER-USER -j TPF2B6-<name> 2>/dev/null || ip6tables -w -I DOCKER-USER 1 -j TPF2B6-<name> 2>/dev/null || true
actionstop = iptables -w -D DOCKER-USER -j TPF2B-<name> 2>/dev/null || true
             iptables -w -F TPF2B-<name> 2>/dev/null || true
             iptables -w -X TPF2B-<name> 2>/dev/null || true
             ip6tables -w -D DOCKER-USER -j TPF2B6-<name> 2>/dev/null || true
             ip6tables -w -F TPF2B6-<name> 2>/dev/null || true
             ip6tables -w -X TPF2B6-<name> 2>/dev/null || true
actioncheck = iptables -w -n -L TPF2B-<name>
actionban = touch /var/log/tproxy-panel/banlist/<name>/<ip>
            iptables -w -I TPF2B-<name> 1 -s <ip> -j DROP
            ip6tables -w -I TPF2B6-<name> 1 -s <ip> -j DROP 2>/dev/null || true
actionunban = rm -f /var/log/tproxy-panel/banlist/<name>/<ip>
              iptables -w -D TPF2B-<name> -s <ip> -j DROP
              ip6tables -w -D TPF2B6-<name> -s <ip> -j DROP 2>/dev/null || true
