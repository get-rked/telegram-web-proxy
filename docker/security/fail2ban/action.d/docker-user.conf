[Definition]
actionstart = iptables -w -N TPROXY-F2B 2>/dev/null || true
              iptables -w -C DOCKER-USER -j TPROXY-F2B 2>/dev/null || iptables -w -I DOCKER-USER 1 -j TPROXY-F2B
              ip6tables -w -N TPROXY-F2B6 2>/dev/null || true
              ip6tables -w -C DOCKER-USER -j TPROXY-F2B6 2>/dev/null || ip6tables -w -I DOCKER-USER 1 -j TPROXY-F2B6 2>/dev/null || true
actionstop = iptables -w -D DOCKER-USER -j TPROXY-F2B 2>/dev/null || true
             iptables -w -F TPROXY-F2B 2>/dev/null || true
             iptables -w -X TPROXY-F2B 2>/dev/null || true
             ip6tables -w -D DOCKER-USER -j TPROXY-F2B6 2>/dev/null || true
             ip6tables -w -F TPROXY-F2B6 2>/dev/null || true
             ip6tables -w -X TPROXY-F2B6 2>/dev/null || true
actioncheck = iptables -w -n -L TPROXY-F2B
actionban = iptables -w -I TPROXY-F2B 1 -s <ip> -j DROP
            ip6tables -w -I TPROXY-F2B6 1 -s <ip> -j DROP 2>/dev/null || true
actionunban = iptables -w -D TPROXY-F2B -s <ip> -j DROP
              ip6tables -w -D TPROXY-F2B6 -s <ip> -j DROP 2>/dev/null || true
